# =============================================================================
# AI 审计 Taskflow 测试示例 — JavaScript / TypeScript 仓库
# =============================================================================
# 用途：对 CodeQL 静态扫描在本仓库（src/**，TypeScript）产生的安全告警做 AI 分流。
# 框架：GitHubSecurityLab/seclab-taskflow-agent
# 说明：
#   - 本文件是一个"测试用示例"，用于验证 AI 审计链路能跑通（CodeQL 告警 -> 信息收集 -> 审计 -> 报告 -> 校验）。
#   - 参照文章中的 JS/TS XSS 审计场景设计（来源/汇点/数据流多样性高，侧重帮助分流者做有根据的判断）。
#   - 请先阅读同目录下的 README.md 了解运行前提。
#
# 适配语言：JavaScript / TypeScript
# 告警输入：由 .github/workflows/codeql.yml 扫描 src/** 产生的 CodeQL 安全告警
# =============================================================================

workflow:
  name: "MZ-MCP JS/TS XSS 告警分流（测试示例）"
  description: >-
    对 src/** 的 JS/TS 安全告警（尤其 XSS、代码注入类）做 AI 分流，
    帮助审计员判断来源点是否可控、汇点是否有防护，剔除误报。
  # 针对 CodeQL 告警列表逐条套用同一套模板（对应文章的 repeat_prompt 批量循环）
  repeat_prompt: "{{alert}}"

  # 1) 信息收集：调 GitHub API / MCP Server 拿告警上下文（来源/汇点/数据流）
  - task: "info_collection"
    name: "收集告警上下文"
    prompt: >-
      你是一名前端安全审计员。请针对以下 JS/TS 安全告警，调用 MCP Server 的
      GitHub API 收集信息：
      - source（来源点）与 sink（汇点）在文件中的精确行号；
      - 从来源到汇点的数据流路径上，是否有转义/清洗器（sanitizer）或 CSP 等防护；
      - 该来源点是否真的接收用户/外部可控输入（如表单、URL、存储、消息事件）；
      - 该汇点（如 innerHTML、eval、document.write 等）是否在危险上下文执行。
      输出请使用 JSON，并严格给出"文件名:行号"引用，不得编造。

  # 2) 审计：帮助分流者判断，而非直接代替决定（对应文章 JS/TS XSS 的设计）
  - task: "triage"
    name: "审计剔除误报"
    depends_on: ["info_collection"]
    prompt: >-
      基于上一步收集的信息，为审计员提供有根据的判断建议：
      - 若来源点实际不可控（无外部输入流入），则倾向误报(FP)；
      - 若来源可控且汇点缺少防护，则倾向真实漏洞(TP)；
      - 对每个判定给出 2-3 条依据，供人工最终拍板。

  # 3) 生成漏洞报告（带精确文件+行号引用）
  - task: "report"
    name: "生成漏洞报告"
    depends_on: ["triage"]
    prompt: >-
      仅对判定倾向为 TP 的告警生成漏洞报告。报告必须包含：
      - 漏洞类型、严重程度；
      - 精确的 source 与 sink 位置（文件+行号）；
      - 数据流/攻击路径描述；
      - 修复建议（如转义、CSP、使用安全 API）。
      若全部为误报，则输出 "NO_VULNERABILITY"。

  # 4) 校验：报告不完整/不一致=幻觉，直接驳回
  - task: "validate"
    name: "报告校验（防幻觉）"
    depends_on: ["report"]
    prompt: >-
      校验上一步生成的漏洞报告：
      - 报告中的文件/行号是否与告警上下文一致？
      - 是否缺少关键字段（漏洞类型/位置/攻击路径）？
      - 若信息缺失或不一致，判定为幻觉并驳回（输出 REJECTED），不创建 Issue。
      通过后输出 APPROVED。

  # 5) 知识回流：人工驳回原因回流给 LLM，持续改进（测试示例中仅记录，不实际创建 Issue）
  - task: "feedback"
    name: "知识回流（预留）"
    depends_on: ["validate"]
    prompt: >-
      将人工审查时产生的"驳回原因/误报标签"记录到本地知识文件，供后续
      同类告警的审计参考，形成持续改进闭环。本测试示例只输出记录结果，不创建 Issue。
