# Issue 规则配置文件
# 用于自动根据 Issue 内容添加标签
# 适用于 MZ-MCP - MCP 服务集成平台项目

rules:
  # Bug 相关
  - title: "Bug Report"
    body: "这是一个 Bug 报告模板"
    labels:
      - "bug"

  - keywords:
      - "bug"
      - "错误"
      - "报错"
      - "异常"
      - "崩溃"
      - "crash"
      - "error"
      - "exception"
      - "fail"
      - "失败"
      - "故障"
    labels:
      - "bug"

  # 功能请求
  - title: "Feature Request"
    body: "这是一个功能请求模板"
    labels:
      - "enhancement"

  - keywords:
      - "feature"
      - "新功能"
      - "新增"
      - "希望"
      - "建议添加"
      - "wish"
    labels:
      - "enhancement"

  # 文档
