name: 发布包到 npm

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm using OIDC
        run: npm publish

      - name: Generate Release Notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          VERSION=${{ steps.extract_version.outputs.version }}

          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES="## 🎉 首次发布\n\n这是 mzmcp - MCP stdio Server 的首次正式发布。\n\n### 功能特性\n- 基于 MCP 协议的 stdio 服务器\n- 使用标准输入输出通信\n- 模块化设计，易于扩展\n\n### 安全特性\n- 使用 npm 受信任发布者（Trusted Publishers）进行发布\n- 基于 OIDC 认证，无需长期有效的 npm token\n- 自动生成和发布 provenance 证明"
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges | \
              sed -E 's/^- (feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert|bump|chore\(|update|add|remove|delete|modify|change|improve|optimize):? ?//g' | \
              sed -E 's/^- (feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert|bump)\([^)]+\): ?//g')
            if [ -z "$CHANGELOG" ]; then
              NOTES="## 📝 更新日志\n\n暂无更新内容"
            else
              NOTES="## 📝 更新日志\n\n### 本次更新\n\n${CHANGELOG}"
            fi
          fi

          echo "$NOTES" > release_notes.md

          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: mzmcp ${{ steps.extract_version.outputs.version }}
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ---

            ## 📦 安装说明

            ### 使用 npm 安装

            ```bash
            npm install mzmcp
            ```

            ### 使用 npx 运行

            ```bash
            npx mzmcp
            ```

            ### MCP Client 配置

            在 MCP Client 的配置文件中添加：

            ```json
            {
              "mcpServers": {
                "mzmcp": {
                  "command": "npx",
                  "args": ["mzmcp"]
                }
              }
            }
            ```

            ### 详细文档

            请查看 [README.md](https://github.com/xiaomizhoubaobei/MZ-MCP/blob/main/readme.md) 获取完整的使用文档。

            ---

            ## 📦 文件说明

            本 Release 包含以下文件：

            - **mzmcp-*.tgz**: npm 包（适用于 npm install）

            ### npm 包验证

            验证已发布的 npm 包：

            ```bash
            npm view mzmcp
            ```

            查看包的详细信息：

            ```bash
            npm info mzmcp
            ```

            ### Provenance 证明

            本包使用 npm 受信任发布者发布，自动生成 provenance 证明。您可以使用以下命令验证包的来源：

            ```bash
            npm audit signatures
            ```

            Provenance 证明提供了包的构建来源和方式的加密验证，确保包的完整性和可信度。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
