---
name: Cloud Service Integration
description: 请求集成新的云服务商或 AI 服务
title: "[Integration] 集成 [云服务商] [服务名称]"
labels: ["enhancement", "multi-cloud"]
assignees: []
body:
  - type: textarea
    id: provider-info
    attributes:
      label: 云服务商信息
      description: 填写云服务商信息
      placeholder: |
        | 项目 | 信息 |
        |------|------|
        | 云服务商 | [例如 华为云, 阿里云, 腾讯云, AWS, Azure, GCP] |
        | 服务名称 | [例如 OCR, TTS, STT, 翻译, 图像识别] |
        | 服务官网 | [链接] |
        | API 文档 | [链接] |
        | SDK 语言 | [例如 Python, Java, Node.js] |
    validations:
      required: true

  - type: textarea
    id: requirement-description
    attributes:
      label: 需求描述
      description: 简要描述需要集成的服务及其功能
      placeholder: |
        例如：集成百度云 OCR 服务，提供通用文字识别、身份证识别、银行卡识别等功能。
    validations:
      required: true

  - type: textarea
    id: documentation-links
    attributes:
      label: 文档链接
      description: 提供相关的文档链接（API 或 SDK 文档必须提供）
      placeholder: |
        - API 文档: [链接]
        - SDK 文档: [链接]
        - 快速开始: [链接]
        - 示例代码: [链接]
    validations:
      required: true

  - type: textarea
    id: core-features
    attributes:
      label: 核心功能
      description: 请列出需要集成的核心功能
      placeholder: |
        - [ ] 功能 1
        - [ ] 功能 2
        - [ ] 功能 3
    validations:
      required: false

  - type: checkboxes
    id: auth-method
    attributes:
      label: 认证方式
      description: 选择认证方式
      options:
        - label: Access Key / Secret Key
        - label: OAuth
        - label: API Key
        - label: 其他（请在下方说明）
    validations:
      required: false

  - type: textarea
    id: api-endpoint
    attributes:
      label: API 端点
      description: 提供 API 端点 URL
      placeholder: |
        ```
        API Endpoint URL
        ```
    validations:
      required: false

  - type: textarea
    id: sdk-info
    attributes:
      label: SDK 信息
      description: 提供 SDK 安装和示例代码
      placeholder: |
        ```python
        # SDK 安装
        pip install ...

        # 示例代码
        ...
        ```
    validations:
      required: false

  - type: textarea
    id: request-example
    attributes:
      label: 请求示例
      description: 提供 API 请求示例
      placeholder: |
        ```json
        {
          "request": "body"
        }
        ```
    validations:
      required: false

  - type: textarea
    id: response-example
    attributes:
      label: 响应示例
      description: 提供 API 响应示例
      placeholder: |
        ```json
        {
          "response": "body"
        }
        ```
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 评估功能优先级
      options:
        - 紧急（项目中需要）
        - 高（重要功能）
        - 中（有用功能）
        - 低（可选功能）
    validations:
      required: false

  - type: textarea
    id: env-config
    attributes:
      label: 环境变量配置
      description: 建议的环境变量命名
      placeholder: |
        ```yaml
        SERVICE_PROVIDER_ACCESS_KEY: xxx
        SERVICE_PROVIDER_SECRET_KEY: xxx
        SERVICE_PROVIDER_REGION: xxx
        ```
    validations:
      required: false

  - type: textarea
    id: mcp-tool-definition
    attributes:
      label: MCP 工具定义
      description: 建议的 MCP 工具名称和参数
      placeholder: |
        工具名称: service_name_operation
        参数:
          - param1: 描述
          - param2: 描述
        返回: 描述返回结果
    validations:
      required: false

  - type: textarea
    id: reference-implementation
    attributes:
      label: 参考实现
      description: 如果该云服务商有类似的 Python SDK 示例，请提供链接或代码
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: 附加信息
      description: 其他有助于集成的信息，如使用限制、计费方式、区域支持、配额限制
      placeholder: |
        - 使用限制
        - 计费方式
        - 区域支持
        - 配额限制
    validations:
      required: false
