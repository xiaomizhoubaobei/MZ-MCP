---
name: Feature Request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 功能描述

        简要描述你想要的功能。

  - type: textarea
    id: problem-background
    attributes:
      label: 问题背景
      description: 请描述这个功能解决什么问题或带来什么价值。
      placeholder: 例如：目前缺少对腾讯云 OCR 的支持，导致需要手动集成。
    validations:
      required: true

  - type: textarea
    id: detailed-description
    attributes:
      label: 详细描述
      description: 请详细描述希望实现的功能，包括功能的具体行为、交互流程、配置方式、与现有功能的关联
      placeholder: |
        - 功能的具体行为
        - 交互流程
        - 配置方式
        - 与现有功能的关联
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 请评估该功能的优先级
      options:
        - 紧急（阻塞当前使用）
        - 高（重要但非阻塞）
        - 中（有用但非必需）
        - 低（锦上添花）
    validations:
      required: false

  - type: textarea
    id: implementation-suggestions
    attributes:
      label: 实现建议（可选）
      description: 如果你有实现思路，请描述技术方案、实现步骤、潜在风险、替代方案
      placeholder: |
        - 技术方案
        - 实现
        - 潜在风险
        - 替代方案
    validations:
      required: false

  - type: textarea
    id: resources
    attributes:
      label: 参考资源（可选）
      description: 相关 Issue 或 PR、参考文档链接、示例代码
      placeholder: |
        - 相关 Issue 或 PR
        - 参考文档链接
        - 示例代码
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: 附加信息
      description: 其他有助于实现该功能的信息
    validations:
      required: false
