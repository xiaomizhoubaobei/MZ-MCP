rules:
  - description: "禁止在代码变更中硬编码密钥或敏感信息"
    enabled: true
    severity: critical
    event_types: [ "pull_request" ]
    parameters:
      # 大小写不敏感 + 词边界精确匹配，避免漏报大写变体、误报宽泛子串
      # 额外覆盖本仓库实际使用的 Huawei Cloud AK/SK 变量名
      security_patterns:
        - "(?i)\\bapi[_-]?key\\b"
        - "(?i)\\b(secret|private|access)[_/-]?key\\b"
        - "(?i)\\b(access|auth)[_/-]?token\\b"
        - "(?i)\\b(db|database)[_/-]?password\\b"
        - "(?i)\\bcloud[_-]?sdk[_-]?(?:ak|sk)\\b"
  - description: "所有提交必须使用 GPG/SSH/S-MIME 签名"
    enabled: true
    severity: critical
    event_types: [ "pull_request" ]
    parameters:
      require_signed_commits: true
  - description: "禁止绕过 PR 直接合并到受保护分支，必须通过 PR 流程变更"
    enabled: true
    severity: critical
    event_types: [ "pull_request" ]
    parameters:
      protected_branches: [ "main", "master" ]
  - description: "PR 标题必须符合 Conventional Commits 规范"
    enabled: true
    severity: high
    event_types: [ "pull_request" ]
    parameters:
      title_pattern: "^(feat|fix|docs|style|refactor|perf|test|chore|build|revert)(\\(.+\\))?!?: .+"
